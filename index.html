<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watson Reader Pro</title>
<style>
html{min-height:100%;background:#080d18;overscroll-behavior-y:none}
body{margin:0;min-height:100vh;min-height:100dvh;box-sizing:border-box;overscroll-behavior-y:none;padding:28px 18px;background:radial-gradient(ellipse at 50% -12%,rgba(255,0,18,.68),transparent 48%),radial-gradient(ellipse at 4% 48%,rgba(230,0,0,.48),transparent 34%),radial-gradient(ellipse at 98% 52%,rgba(230,0,0,.44),transparent 36%),radial-gradient(ellipse at 50% 115%,rgba(230,0,0,.38),transparent 46%),repeating-radial-gradient(ellipse at 50% 8%,transparent 0 185px,rgba(255,20,35,.32) 188px 194px,transparent 199px 320px),linear-gradient(135deg,#080d18 0%,#111827 55%,#100b12 100%);background-attachment:fixed;color:white;font-family:Segoe UI,system-ui,sans-serif;display:flex;justify-content:center;align-items:flex-start}
.container>*{position:relative;z-index:1}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid rgba(255,255,255,.09)}
h1{margin:0;font-size:clamp(24px,3vw,34px);letter-spacing:-.6px;text-shadow:0 2px 18px rgba(0,0,0,.25)}
h1::first-letter{color:#ff3333}
.headphones{margin-right:7px}
.pro{color:#ff3038}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0;color:#ff3038;font-size:clamp(20px,2.5vw,30px);font-weight:750;letter-spacing:-.8px;text-shadow:0 0 18px rgba(230,0,0,.18)}
.vodafone-mark{display:inline-block;width:34px;height:34px;border-radius:50%;background:#e60000;position:relative;box-shadow:0 0 16px rgba(230,0,0,.2)}
.vodafone-mark::after{content:"";position:absolute;width:17px;height:19px;left:10px;top:4px;border-radius:55% 45% 55% 45%;background:#111827;transform:rotate(28deg)}
.container{box-sizing:border-box;width:min(1320px,100%);margin:auto 0;background:linear-gradient(145deg,rgba(31,41,55,.97),rgba(17,24,39,.98));border:1px solid rgba(255,255,255,.07);border-top:3px solid #E60000;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.42),0 0 44px rgba(230,0,0,.16);padding:26px;position:relative;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:nowrap;width:100%;padding:9px;margin-top:14px;background:linear-gradient(135deg,rgba(8,15,29,.94),rgba(20,27,42,.88));border:1px solid rgba(148,163,184,.18);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 10px 30px rgba(0,0,0,.16)}
.voice-controls{display:flex;align-items:center;gap:7px;flex-wrap:nowrap;margin-left:auto;padding-left:0;border-left:0;flex:0 1 auto;min-width:0}
.voice-controls #voz{width:clamp(150px,22vw,270px);min-width:120px;max-width:270px}
.voice-controls #velocidade{flex:0 0 76px;min-width:76px}
button{min-height:36px;padding:8px 11px;border:1px solid rgba(255,255,255,.1);border-radius:11px;cursor:pointer;font:600 13px/1.1 "Segoe UI",system-ui,sans-serif;letter-spacing:.2px;transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease,filter .18s ease}
button:hover{transform:translateY(-1px);filter:brightness(1.1)}
button:active{transform:translateY(0) scale(.98)}
button:focus-visible{outline:2px solid #ff4d4d;outline-offset:3px}
.play{color:#fff;background:linear-gradient(135deg,#ff3038,#c90018);border-color:rgba(255,85,95,.65);box-shadow:0 0 18px rgba(230,0,0,.22),inset 0 1px 0 rgba(255,255,255,.18)}
.pause,.stop,.nav{color:#e5edf8;background:linear-gradient(180deg,rgba(51,65,85,.72),rgba(30,41,59,.9));border-color:rgba(148,163,184,.2)}
.pause:hover,.stop:hover,.nav:hover{background:linear-gradient(180deg,rgba(71,85,105,.86),rgba(39,52,73,.98));border-color:rgba(255,255,255,.22);box-shadow:0 0 14px rgba(148,163,184,.08)}
.stop{color:#ff9a9f}
.nav{min-width:36px;padding:8px 9px;font-size:14px}
select{min-height:36px;padding:7px 28px 7px 10px;color:#e5edf8;background-color:#111c30;border:1px solid rgba(148,163,184,.24);border-radius:11px;outline:none}
select:focus-visible{border-color:#ff454d;box-shadow:0 0 0 3px rgba(230,0,0,.13)}
textarea{display:block;box-sizing:border-box;width:100%;height:170px;border:1px solid #3b4a63;border-radius:14px;padding:18px 20px;margin-top:20px;margin-bottom:15px;resize:vertical;background:linear-gradient(145deg,#111c30,#0f172a);color:#e5edf8;font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.7;letter-spacing:.1px;outline:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.18),0 4px 14px rgba(0,0,0,.10);transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
textarea::placeholder{color:#8291a9;opacity:1}
textarea:hover{border-color:#526783}
textarea:focus{border-color:#60a5fa;background:#101b2e;box-shadow:0 0 0 3px rgba(96,165,250,.16),inset 0 1px 3px rgba(0,0,0,.15)}
textarea::selection{background:rgba(96,165,250,.4);color:#fff}
.time-progress{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:0;margin-bottom:8px;color:#cbd5e1;font-size:13px}
.time-progress strong{color:#fff;font-variant-numeric:tabular-nums;font-weight:700}
.status-leitura{min-height:1.2em;color:#94a3b8;font-size:12px}
.progress{width:100%;height:7px;background:#374151;border-radius:999px;margin-top:0;margin-bottom:14px;overflow:hidden;cursor:pointer}
.progress:focus-visible{outline:2px solid #ff4d4d;outline-offset:3px}
.progress-bar{width:0%;height:100%;background:#22c55e;transition:width .1s linear;pointer-events:none}
.text-stage{position:relative;margin-top:20px;border-radius:14px}
.text-stage textarea{margin-top:0;margin-bottom:0;height:300px}
.text-stage .reader{display:none;box-sizing:border-box;height:300px;margin:0;overflow:auto;background:rgba(8,18,37,.82);border:1px solid rgba(96,165,250,.16);border-radius:14px;padding:22px 24px;line-height:1.9;font-size:17px;color:#e5edf8;cursor:pointer}
.container.reading-mode .text-stage textarea{display:none}
.container.reading-mode .text-stage .reader{display:block}
.text-stage textarea,.text-stage .reader{scrollbar-width:thin;scrollbar-color:#e60000 #111827}
.text-stage textarea::-webkit-scrollbar,.text-stage .reader::-webkit-scrollbar{width:12px}
.text-stage textarea::-webkit-scrollbar-track,.text-stage .reader::-webkit-scrollbar-track{background:#111827}
.text-stage textarea::-webkit-scrollbar-thumb,.text-stage .reader::-webkit-scrollbar-thumb{background-color:#e60000;border:2px solid #111827;border-radius:10px}
.text-stage textarea::-webkit-scrollbar-thumb:hover,.text-stage .reader::-webkit-scrollbar-thumb:hover{background-color:#ff454d}
.sentence{border-radius:6px}
.sentence.current-sentence{background:#facc15;color:#111827;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#seguirLeituraBtn[aria-pressed="false"]{border-color:rgba(250,204,21,.45);color:#facc15}
.reader{overscroll-behavior:contain}
.word{border-radius:4px;cursor:pointer}
.word:hover{background:rgba(250,204,21,.22)}
.word.current{background:transparent;color:inherit}
.reading-chunk{border-radius:5px;transition:background-color .12s,color .12s}
.reading-chunk.current-chunk{background:transparent;color:inherit}

@media(max-width:900px) and (min-width:651px){
  .toolbar{flex-wrap:wrap}
  .voice-controls{margin-left:auto}
  .voice-controls #voz{width:190px;min-width:130px}
}
@media(max-width:650px){
  body{padding:14px 10px;align-items:flex-start}
  .container{padding:17px}
  .app-header{align-items:flex-start;flex-direction:column;gap:12px}
  .brand{font-size:22px}
  .vodafone-mark{width:27px;height:27px}
  .vodafone-mark::after{width:14px;height:15px;left:8px;top:4px}
  .toolbar{flex-wrap:wrap;gap:6px;padding:9px}
  .toolbar button{min-height:34px;padding:7px 9px;font-size:12px}
  .toolbar .nav{min-width:32px;padding:7px}
  .voice-controls{width:100%;margin-left:0;padding-top:8px;border-top:1px solid rgba(148,163,184,.16);flex-wrap:nowrap}
  .voice-controls #voz{flex:1 1 auto;width:auto;min-width:0;max-width:none}
  .voice-controls #velocidade{flex:0 0 82px}
  .text-stage textarea,.text-stage .reader{height:260px;padding:15px;font-size:15px}
  .time-progress{font-size:12px;gap:6px}
}
.piper-sync{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 4px 0;color:#cbd5e1;font-size:12px}
.piper-sync[hidden]{display:none}
.piper-sync input[type="range"]{width:160px;accent-color:#ef4444}
.piper-sync output{min-width:50px;color:#fff;font-variant-numeric:tabular-nums}
.piper-sync small{color:#94a3b8}
.privacy-hint{margin:10px 0 0;padding:9px 12px;border:1px solid rgba(96,165,250,.22);border-radius:10px;background:rgba(10,23,41,.65);font-size:12px;color:#cbd5e1;line-height:1.5}
.privacy-hint strong{color:#a5d8ff}
</style>

<body>
<div class="container">
<header class="app-header">
<h1><span class="headphones" aria-hidden="true">🎧</span> Watson Reader <span class="pro">Pro</span></h1>
<div class="brand" aria-label="Vodafone"><span class="vodafone-mark" aria-hidden="true"></span><span>vodafone</span></div>
</header>
<div class="time-progress" aria-live="polite">
  <span>Tempo decorrido: <strong id="elapsedTime">00:00</strong></span>
  <span class="status-leitura" id="statusLeitura"></span>
  <span>Duração estimada: <strong id="totalTime">00:00</strong></span>
</div>
<div class="progress" id="progressTrack" role="slider" aria-label="Progresso da leitura" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
  <div id="progressBar" class="progress-bar"></div>
</div>
<div class="text-stage" id="textStage">
<textarea id="inputText" placeholder="Cole aqui a transcrição com Ctrl+V... (texto não editável)" aria-label="Texto para narrar (colagem e substituição completas)" readonly spellcheck="false"></textarea>
<div id="reader" class="reader" tabindex="0" aria-label="Transcrição em leitura, apenas de consulta" aria-live="off">Aguardando texto...</div>
</div>
<div class="privacy-hint" role="status" aria-live="polite"><strong>🛡 Proteção local ativa:</strong> <span id="privacyResult">Ao colar, o Watson oculta todos os números e moradas detetadas. Os nomes ficam visíveis. Revê o texto antes de reproduzir.</span></div>
<div class="toolbar">
<button type="button" class="play" onclick="playAudio()">▶ Play</button>
<button type="button" class="pause" onclick="pauseAudio()">⏸ Pause</button>
<button type="button" class="stop" onclick="stopAudio()">⏹ Stop</button>
<button type="button" class="nav" onclick="limparTranscricao()" title="Limpar toda a transcrição">🗑 Limpar</button>
<button type="button" class="nav" onclick="fraseAnterior()" aria-label="Frase anterior">⏪</button>
<button type="button" class="nav" onclick="proximaFrase()" aria-label="Próxima frase">⏩</button>
<button type="button" class="nav" id="seguirLeituraBtn" onclick="alternarSeguimento()" aria-pressed="true" title="Ativar ou desativar o seguimento automático">📍 A seguir</button>
<div class="voice-controls">

<select id="voz" onchange="atualizarConfiguracoesVoz()" aria-label="Escolher voz Piper offline"><option value="">A carregar vozes Piper…</option></select>

<select id="velocidade" onchange="atualizarConfiguracoesVoz()" aria-label="Velocidade da leitura"><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option><option value="2.5">2.5x</option><option value="3">3x</option></select>
</div>
</div>

</div>
<script>
"use strict";

let frases = [];
let palavrasPorFrase = [];
let indiceAtual = 0;
let posicaoNoBloco = 0;
let inicioPalavraAtual = -1;
let fimPalavraAtual = -1;
let reproduzindo = false;
let idReproducao = 0;
let textoPreparado = "";
let versaoTexto = 0;
let versaoRenderizada = -1;
let intervaloRelogio = null;
let leituraConcluida = false;
let palavraDestacada = null;
let fraseDestacada = null;
let trechoDestacado = null;
let indiceTrechoAtual = -1;
let vozAnterior = "";
let temporizadorReinicioSalto = null;

// Piper corre apenas através do servidor local fornecido neste pacote.
const PREFIXO_VOZ_PIPER = "__piper_local__:";
let vozesPiper = [];
const ehVozPiper = valor => typeof valor === "string" && valor.startsWith(PREFIXO_VOZ_PIPER);
const API_PIPER = "/api/piper";
let audioPiper = null;
let urlAudioPiper = null;
let pedidoPiper = null;
let temporizadorDestaquePiper = null;
let inicioTrechoPiper = 0;
let tokensTrechoPiper = [];
let duracaoAudioPiper = 0;
let segmentosPiper = [];
let mapaTemposPiper = [];
let duracoesTrechosPiper = [];
const audiosPreparadosPiper = new Map();
const QUANTIDADE_PREPARAR_PIPER = 1;
let adiantamentoPiper = 0.15;
let seguirLeituraAutomaticamente = true;


const campoTexto = document.getElementById("inputText");
const painelLeitura = document.getElementById("reader");
const barraProgresso = document.getElementById("progressBar");
const faixaProgresso = document.getElementById("progressTrack");
const estadoLeitura = document.getElementById("statusLeitura");

function atualizarBotaoSeguimento() {
    const botao = document.getElementById("seguirLeituraBtn");
    if (!botao) return;
    botao.setAttribute("aria-pressed", String(seguirLeituraAutomaticamente));
    botao.textContent = seguirLeituraAutomaticamente ? "📍 A seguir" : "📌 Scroll livre";
    botao.title = seguirLeituraAutomaticamente
        ? "O Watson acompanha a leitura. Desloca o texto para desativar."
        : "Clica aqui para voltar a acompanhar a leitura.";
}
function desativarSeguimento() {
    if (!seguirLeituraAutomaticamente) return;
    seguirLeituraAutomaticamente = false;
    atualizarBotaoSeguimento();
}
function alternarSeguimento() {
    seguirLeituraAutomaticamente = !seguirLeituraAutomaticamente;
    atualizarBotaoSeguimento();
    if (seguirLeituraAutomaticamente) aplicarDestaque();
}
// Qualquer tentativa de navegar manualmente tem prioridade sobre o destaque.
// O seguimento só regressa com o botão, nunca por um temporizador.
painelLeitura.addEventListener("wheel", desativarSeguimento, {passive:true});
painelLeitura.addEventListener("touchstart", desativarSeguimento, {passive:true});
painelLeitura.addEventListener("pointerdown", evento => {
    const r = painelLeitura.getBoundingClientRect();
    if (evento.clientX >= r.right - 24 || !evento.target.closest(".sentence")) desativarSeguimento();
}, {passive:true});
painelLeitura.addEventListener("keydown", evento => {
    if (["ArrowUp", "ArrowDown", "PageUp", "PageDown", "Home", "End", " "].includes(evento.key)) desativarSeguimento();
});
function atualizarVisibilidadeSincronia() {}
function vozAtual() {
    return document.getElementById("voz").value;
}
function velocidadeAtual() {
    return Math.max(0.1, parseFloat(document.getElementById("velocidade").value) || 1);
}
function definirStatus(texto) {
    estadoLeitura.textContent = texto || "";
}
function formatarTempo(segundos) {
    const total = Math.max(0, Math.floor(segundos || 0));
    const horas = Math.floor(total / 3600);
    const minutos = Math.floor((total % 3600) / 60);
    const segundosRestantes = total % 60;
    return horas > 0
        ? `${String(horas).padStart(2, "0")}:${String(minutos).padStart(2, "0")}:${String(segundosRestantes).padStart(2, "0")}`
        : `${String(minutos).padStart(2, "0")}:${String(segundosRestantes).padStart(2, "0")}`;
}
function tokenizarPalavras(texto) {
    const lista = [];
    const re = /\S+/g;
    let match;
    while ((match = re.exec(texto)) !== null) {
        lista.push({ inicio: match.index, fim: match.index + match[0].length, texto: match[0] });
    }
    return lista;
}
function palavraEm(indiceFrase, posicao) {
    const lista = palavrasPorFrase[indiceFrase] || [];
    if (!lista.length) return null;
    return lista.find(p => posicao >= p.inicio && posicao < p.fim)
        || lista.find(p => posicao >= p.inicio && posicao <= p.fim)
        || null;
}
function calcularDuracaoEstimadaSilenciosa() {
    const texto = campoTexto.value.trim();
    const palavras = texto ? (texto.match(/\S+/g) || []).length : 0;
    return palavras ? (palavras / (150 * velocidadeAtual())) * 60 : 0;
}
function calcularFracaoLeitura() {
    const texto = campoTexto.value.trim();
    const totalPalavras = (texto.match(/\S+/g) || []).length;
    if (!totalPalavras) return 0;
    if (leituraConcluida) return 1;
    let percorrido = 0;
    for (let i = 0; i < indiceAtual; i++) percorrido += (palavrasPorFrase[i] || []).length;
    const atual = palavraEm(indiceAtual, inicioPalavraAtual >= 0 ? inicioPalavraAtual : posicaoNoBloco);
    if (atual) {
        const lista = palavrasPorFrase[indiceAtual] || [];
        percorrido += Math.max(0, lista.indexOf(atual));
    } else if (posicaoNoBloco > 0) {
        percorrido += (palavrasPorFrase[indiceAtual] || []).filter(p => p.fim <= posicaoNoBloco).length;
    }
    return Math.max(0, Math.min(1, percorrido / totalPalavras));
}
function atualizarInterfaceTempo() {
    const estimado = calcularDuracaoEstimadaSilenciosa();
    const fracao = calcularFracaoLeitura();
    document.getElementById("elapsedTime").textContent = formatarTempo(estimado * fracao);
    document.getElementById("totalTime").textContent = formatarTempo(estimado);
    barraProgresso.style.width = (fracao * 100) + "%";
    faixaProgresso.setAttribute("aria-valuenow", String(Math.round(fracao * 100)));
}
function iniciarRelogio() {
    leituraConcluida = false;
    if (intervaloRelogio !== null) clearInterval(intervaloRelogio);
    intervaloRelogio = setInterval(atualizarInterfaceTempo, 100);
    atualizarInterfaceTempo();
}
function pausarRelogio() {
    if (intervaloRelogio !== null) clearInterval(intervaloRelogio);
    intervaloRelogio = null;
    atualizarInterfaceTempo();
}
function reiniciarRelogio(concluida = false) {
    if (intervaloRelogio !== null) clearInterval(intervaloRelogio);
    intervaloRelogio = null;
    leituraConcluida = concluida;
    atualizarInterfaceTempo();
}
function definirModoLeitura(ativar) {
    document.querySelector(".container").classList.toggle("reading-mode", ativar);
}
function limparTemporizadoresVoz() {
    if (temporizadorReinicioSalto !== null) clearTimeout(temporizadorReinicioSalto);
    temporizadorReinicioSalto = null;
}
function limparAudioPiper() {
    if (temporizadorDestaquePiper !== null) clearInterval(temporizadorDestaquePiper);
    temporizadorDestaquePiper = null;
    if (pedidoPiper) pedidoPiper.abort();
    pedidoPiper = null;
    if (audioPiper) {
        audioPiper.pause();
        audioPiper.onended = null;
        audioPiper.onerror = null;
        audioPiper.onloadedmetadata = null;
        audioPiper.removeAttribute("src");
        audioPiper.load();
        audioPiper = null;
    }
    if (urlAudioPiper) URL.revokeObjectURL(urlAudioPiper);
    urlAudioPiper = null;
    tokensTrechoPiper = [];
    duracaoAudioPiper = 0;
    segmentosPiper = [];
    mapaTemposPiper = [];
    duracoesTrechosPiper = [];
    indiceTrechoAtual = -1;
}

// Grupos curtos com limites temporais exatos (medidos no áudio produzido pelo Piper).
// O posicionamento dentro de cada grupo considera a extensão das palavras e pontuação.
// Mantém expressões e frases completas. Só subdivide frases excepcionalmente longas,
// preferindo vírgulas ou outros limites naturais, nunca de 14 em 14 palavras.
// A pronúncia é preparada apenas no pedido ao Piper; o texto visível não é alterado.
const ABREVIATURAS_PIPER = [
    [/\bSras\./gi,"Senhoras"], [/\bSrs\./gi,"Senhores"],
    [/\bSra\./gi,"Senhora"], [/\bSr\./gi,"Senhor"],
    [/\bDra\./gi,"Doutora"], [/\bDr\./gi,"Doutor"],
    [/\bEnga\./gi,"Engenheira"], [/\bEng\./gi,"Engenheiro"],
    [/\bExma\./gi,"Excelentíssima"], [/\bExmo\./gi,"Excelentíssimo"],
    [/\bAv\./gi,"Avenida"], [/\bProfª\./gi,"Professora"],
    [/\bProf\./gi,"Professor"], [/\bn\s*\.\s*º/gi,"número"]
];
function pronunciaPiper(texto) {
    let resultado=texto;
    for (const [patrao,troca] of ABREVIATURAS_PIPER) resultado=resultado.replace(patrao,troca);
    // Preservamos ? e ! para a entoação nativa do modelo Piper.
    // Não acrescentamos pausas artificiais nem partimos perguntas em palavras.
    return resultado;
}
// A proteção só afeta o texto colocado no Watson; não é anonimização garantida.
function protegerTranscricao(original) {
    // Proteção local, conservadora quanto aos nomes próprios:
    // nunca procura nem substitui nomes de pessoas.
    // Oculta TODOS os algarismos, incluindo valores isolados e formatos mistos.
    const candidatos=[];
    const incluir=(inicio,fim,tipo,peso)=>{if(fim>inicio)candidatos.push({inicio,fim,tipo,peso});};
    const detetar=(patrao,tipo,peso,validar)=>{
        for(const m of original.matchAll(patrao)) {
            if(!validar || validar(m[0],m)) incluir(m.index,m.index+m[0].length,tipo,peso);
        }
    };
    // Moradas: o nome da rua pode conter nomes próprios, mas a morada completa é protegida.
    detetar(/\b(?:Rua|R\.|Avenida|Av\.|Travessa|Tv\.|Estrada|Praceta|Alameda|Praça|Largo|Urbanização|Urb\.|Beco|Calçada|Caminho|Rotunda|Bairro)\s+(?:[^\n.!?;]|\.(?=\s*\d)){3,140}/giu,'MORADA',100);
    detetar(/[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/g,'EMAIL',95);
    // IBAN português, com ou sem espaços, e também IBAN internacionais conhecidos.
    detetar(/\bPT\s*5\s*0(?:[ \t.-]*\d){21}\b/gi,'IBAN',92);
    detetar(/\b[A-Z]{2}\d{2}(?:[ \t.-]*[A-Z0-9]){11,30}\b/gi,'IBAN',90);
    // Referências e números de conta/contrato, incluindo códigos alfanuméricos.
    detetar(/\b(?:IBAN|NIB|NIF|NIPC|contribuinte|número\s+fiscal|conta|contrato|cliente|processo|referência|referencia|pedido|cartão|cartao)\s*(?:n[ºo.]*)?\s*[:#-]\s*[A-Z0-9/_-]*\d[A-Z0-9/_-]*(?:[ \t]+[A-Z0-9/_-]*\d[A-Z0-9/_-]*)*/gi,'IDENTIFICADOR',75);
    detetar(/\b\d{4}[ \t]*-[ \t]*\d{3}\b/g,'CODIGO_POSTAL',70);
    // Telefones com separadores habituais, incluindo prefixo internacional.
    detetar(/(?<!\d)(?:\+351[ \t.-]?)?[29]\d{2}[ \t.-]?\d{3}[ \t.-]?\d{3}(?!\d)/g,'TELEFONE',65);
    // Sequências de algarismos com separadores mistos: espaços, pontos, vírgulas,
    // dois-pontos, barra, hífen e ponto e vírgula. Inclui números isolados.
    // Não captura quebras de linha nem palavras entre números.
    detetar(/\d+(?:(?:[ \t]*[.,;:\/-][ \t]*|[ \t]+)\d+)*/g,'NUMERO',10);
    // Mais específico primeiro. Um número dentro de uma morada, email ou IBAN
    // não deve gerar uma segunda etiqueta sobreposta.
    candidatos.sort((a,b)=>b.peso-a.peso||(b.fim-b.inicio)-(a.fim-a.inicio));
    const aceites=[];
    for(const c of candidatos) {
        if(!aceites.some(a=>c.inicio<a.fim&&a.inicio<c.fim)) aceites.push(c);
    }
    aceites.sort((a,b)=>a.inicio-b.inicio);
    const contagens=new Map(), equivalencias=new Map();
    let cursor=0,saida='';
    for(const c of aceites) {
        saida+=original.slice(cursor,c.inicio);
        const valor=original.slice(c.inicio,c.fim);
        const chave=c.tipo+'|'+valor.toLocaleLowerCase('pt-PT').replace(/\s+/g,' ').trim();
        let etiqueta=equivalencias.get(chave);
        if(!etiqueta) {
            const n=(contagens.get(c.tipo)||0)+1;
            contagens.set(c.tipo,n);
            etiqueta='['+c.tipo.replace(/_/g,' ')+' '+n+']';
            equivalencias.set(chave,etiqueta);
        }
        saida+=etiqueta;
        cursor=c.fim;
    }
    saida+=original.slice(cursor);
    return {texto:saida,substituicoes:aceites.length};
}
// Uma abreviatura expandida nunca é tratada como ponto final.
function terminaFraseParaPiper(token) {
    const expandido = pronunciaPiper(token.texto);
    return /[.!?…]["'”’)]*$/.test(expandido);
}
function pausaNaturalParaPiper(token) {
    return /[,;:]["'”’)]*$/.test(pronunciaPiper(token.texto));
}
function construirSegmentosPiper(frase, tokens) {
    const grupos = [];
    if (!tokens.length) return grupos;
    const LIMITE = 560; // O servidor aceita até 600 caracteres por segmento.
    let i = 0;
    while (i < tokens.length) {
        let fim = i;
        while (fim < tokens.length && tokens[fim].fim - tokens[i].inicio <= LIMITE) {
            fim++;
            if (terminaFraseParaPiper(tokens[fim - 1])) break;
        }
        if (fim === i) fim = i + 1;
        // Só em frases extensas: procurar pontuação respiratória perto do corte.
        if (fim < tokens.length && !terminaFraseParaPiper(tokens[fim - 1])) {
            const limiteAtual = fim;
            for (let j = fim - 1; j >= Math.max(i + 3, fim - 9); j--) {
                if (pausaNaturalParaPiper(tokens[j])) {fim = j + 1; break;}
            }
            if (fim === limiteAtual && fim < tokens.length && tokens[fim].fim - tokens[i].inicio < LIMITE) fim++;
        }
        const selecionados = tokens.slice(i, fim);
        const inicio = selecionados[0].inicio;
        const limite = selecionados[selecionados.length - 1].fim;
        grupos.push({inicio, fim: limite, texto: frase.slice(inicio, limite), tokens: selecionados});
        i = fim;
    }
    return grupos;
}
function pesoPalavraPiper(token) {
    const limpa = token.texto.replace(/[^\p{L}\p{N}]/gu, "");
    const letras = [...limpa].length;
    let peso = 0.65 + Math.pow(Math.max(1, letras), 0.72) * 0.46;
    if (/[,;:]$/.test(token.texto)) peso += 0.65;
    if (terminaFraseParaPiper(token)) peso += 1.1;
    return peso;
}
function criarMapaTemposPiper(duracoes, grupos) {
    const mapa = [];
    let instante = 0;
    for (let i = 0; i < grupos.length; i++) {
        const tokens = grupos[i].tokens;
        const duracao = Number(duracoes[i]);
        if (!tokens.length || !Number.isFinite(duracao) || duracao <= 0) return [];
        const pesos = tokens.map(pesoPalavraPiper);
        const soma = pesos.reduce((a,b) => a+b, 0);
        let acumulado = 0;
        tokens.forEach((token, j) => {
            mapa.push({tempo: instante + duracao * acumulado / soma, token});
            acumulado += pesos[j];
        });
        instante += duracao;
    }
    return mapa;
}
function prepararDestaquePiper() {
    if (!audioPiper || !Number.isFinite(audioPiper.duration) || audioPiper.duration <= 0) return;
    duracaoAudioPiper = audioPiper.duration;
    const tempo = Math.max(0, Math.min(duracaoAudioPiper - 0.001, audioPiper.currentTime + adiantamentoPiper));
    // A duração REAL de cada trecho determina o destaque. Não tentamos adivinhar
    // em que palavra o Piper está, evitando 3-4 palavras de atraso visual.
    let decorrido = 0;
    let escolhido = 0;
    for (let i = 0; i < segmentosPiper.length; i++) {
        const duracao = Number(duracoesTrechosPiper[i]) || 0;
        if (tempo < decorrido + duracao || i === segmentosPiper.length - 1) {escolhido = i; break;}
        decorrido += duracao;
    }
    if (segmentosPiper[escolhido]) {
        indiceTrechoAtual = escolhido;
        const grupo = segmentosPiper[escolhido];
        // Para a barra de progresso, uma estimativa interna é suficiente.
        const proporcao = Math.max(0, Math.min(0.999, (tempo - decorrido) / Math.max(0.001, Number(duracoesTrechosPiper[escolhido]) || 1)));
        const indiceToken = Math.min(grupo.tokens.length - 1, Math.floor(proporcao * grupo.tokens.length));
        const token = grupo.tokens[indiceToken];
        if (token) definirCursor(indiceAtual, token.inicio, token.fim);
        aplicarDestaque();
        atualizarInterfaceTempo();
    }
}

// O Piper prepara os dois blocos seguintes enquanto o bloco atual é reproduzido.
// Limita-se a memória a dois WAVs futuros e cancela pedidos antigos ao parar/saltar.
function cancelarPreparacaoPiper() {
    for (const entrada of audiosPreparadosPiper.values()) entrada.controller.abort();
    audiosPreparadosPiper.clear();
}

function dadosDoBlocoPiper(indice, inicio = 0) {
    const frase = frases[indice] || "";
    const tokens = (palavrasPorFrase[indice] || []).filter(p => p.fim > inicio);
    const grupos = construirSegmentosPiper(frase, tokens);
    return { indice, inicio, tokens, grupos, trecho: frase.slice(inicio).trim() };
}

async function sintetizarBlocoPiper(dados, voz, signal) {
    const resposta = await fetch(API_PIPER, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text: pronunciaPiper(dados.trecho), segments: dados.grupos.map(g => pronunciaPiper(g.texto)), voice: voz}),
        signal, cache: "no-store"
    });
    if (!resposta.ok) {
        let detalhe = "Erro HTTP " + resposta.status;
        try { const erro = await resposta.json(); detalhe = erro.error || detalhe; } catch (_) {}
        throw new Error(detalhe);
    }
    let duracoes = [];
    try { duracoes = JSON.parse(resposta.headers.get("X-Watson-Timings") || "[]"); } catch (_) {}
    const audio = await resposta.blob();
    return { audio, duracoes };
}

function prepararProximosBlocosPiper(minha) {
    if (minha !== idReproducao || !ehVozPiper(vozAtual())) return;
    const voz = vozAtual().slice(PREFIXO_VOZ_PIPER.length);
    const primeiro = indiceAtual + 1;
    for (let indice = primeiro; indice < Math.min(frases.length, primeiro + QUANTIDADE_PREPARAR_PIPER); indice++) {
        if (audiosPreparadosPiper.has(indice)) continue;
        const dados = dadosDoBlocoPiper(indice);
        if (!dados.trecho || !dados.grupos.length) continue;
        const controller = new AbortController();
        const entrada = { voz, controller, dados, promessa: null };
        entrada.promessa = sintetizarBlocoPiper(dados, voz, controller.signal)
            .catch(erro => {
                if (erro.name !== "AbortError") console.warn("Pré-carregamento Piper:", erro);
                return null; // Quando necessário, o leitor pode tentar novamente.
            });
        audiosPreparadosPiper.set(indice, entrada);
    }
}

async function lerBlocoPiper(minha) {
    if (minha !== idReproducao || !reproduzindo || indiceAtual >= frases.length) return;
    const indice = indiceAtual;
    const inicio = Math.max(0, Math.min(posicaoNoBloco, frases[indice].length));
    const dados = dadosDoBlocoPiper(indice, inicio);
    if (!dados.trecho || !dados.grupos.length) {
        concluirBlocoPiper(minha);
        return;
    }
    inicioTrechoPiper = inicio;
    tokensTrechoPiper = dados.tokens;
    segmentosPiper = dados.grupos;
    indiceTrechoAtual = -1;
    const voz = vozAtual().slice(PREFIXO_VOZ_PIPER.length);
    const preparada = audiosPreparadosPiper.get(indice);
    if (preparada) audiosPreparadosPiper.delete(indice);
    if (preparada && (preparada.voz !== voz || preparada.dados.inicio !== inicio)) {
        preparada.controller.abort();
    }
    const usarPreparada = preparada && preparada.voz === voz && preparada.dados.inicio === inicio;
    if (!usarPreparada) pedidoPiper = new AbortController();
    definirStatus(usarPreparada ? "Piper: a passar ao bloco seguinte…" : "Piper: a gerar áudio local…");
    try {
        let resultado = usarPreparada ? await preparada.promessa : null;
        if (!resultado) {
            if (!pedidoPiper) pedidoPiper = new AbortController();
            resultado = await sintetizarBlocoPiper(dados, voz, pedidoPiper.signal);
        }
        if (minha !== idReproducao || !reproduzindo || indiceAtual !== indice || vozAtual().slice(PREFIXO_VOZ_PIPER.length) !== voz) return;
        pedidoPiper = null;
        mapaTemposPiper = criarMapaTemposPiper(resultado.duracoes, segmentosPiper);
        duracoesTrechosPiper = resultado.duracoes;
        urlAudioPiper = URL.createObjectURL(resultado.audio);
        audioPiper = new Audio(urlAudioPiper);
        audioPiper.playbackRate = velocidadeAtual();
        audioPiper.onloadedmetadata = () => prepararDestaquePiper();
        audioPiper.onended = () => {
            if (minha !== idReproducao || !reproduzindo) return;
            limparAudioPiper();
            concluirBlocoPiper(minha);
        };
        audioPiper.onerror = () => {
            if (minha !== idReproducao) return;
            falharPiper("Não foi possível reproduzir o áudio gerado.");
        };
        await audioPiper.play();
        if (minha !== idReproducao) return;
        definirStatus("Piper offline · próximo bloco em preparação");
        temporizadorDestaquePiper = setInterval(prepararDestaquePiper, 40);
        prepararProximosBlocosPiper(minha);
    } catch (erro) {
        if (minha !== idReproducao || erro.name === "AbortError") return;
        falharPiper(erro.message || String(erro));
    }
}

function falharPiper(mensagem) {
    cancelarPreparacaoPiper();
    limparAudioPiper();
    reproduzindo = false;
    idReproducao++;
    pausarRelogio();
    definirStatus("Piper: " + mensagem);
    console.error("Erro Piper:", mensagem);
}

function concluirBlocoPiper(minha) {
    if (minha !== idReproducao || !reproduzindo) return;
    posicaoNoBloco = 0;
    inicioPalavraAtual = -1;
    fimPalavraAtual = -1;
    indiceTrechoAtual = -1;
    if (indiceAtual < frases.length - 1) {
        indiceAtual++;
        renderizarLeitura();
        lerBlocoPiper(minha);
    } else {
        cancelarPreparacaoPiper();
        reproduzindo = false;
        leituraConcluida = true;
        pausarRelogio();
        atualizarInterfaceTempo();
        definirStatus("Concluído · Piper offline");
    }
}

function iniciarPiper() {
    if (audioPiper && audioPiper.paused) {
        reproduzindo = true;
        iniciarRelogio();
        audioPiper.playbackRate = velocidadeAtual();
        audioPiper.play().then(() => definirStatus("Piper offline · destaque aproximado"))
            .catch(erro => falharPiper(erro.message));
        return;
    }
    cancelarPreparacaoPiper();
    limparAudioPiper();
    const minha = ++idReproducao;
    reproduzindo = true;
    iniciarRelogio();
    lerBlocoPiper(minha);
}

function pararMotor(opcoes = {}) {
    const manterRelogio = !!opcoes.manterRelogio;
    limparTemporizadoresVoz();
    cancelarPreparacaoPiper();
    limparAudioPiper();
    reproduzindo = false;
    idReproducao++;
    if (!manterRelogio) pausarRelogio();
    definirStatus("");
}
function aplicarDestaque() {
    const fraseEl = document.getElementById("frase-" + indiceAtual);
    if (fraseDestacada && fraseDestacada !== fraseEl)
        fraseDestacada.classList.remove("current-sentence");
    if (trechoDestacado) trechoDestacado.classList.remove("current-chunk");
    trechoDestacado = null;
    if (fraseEl) {
        fraseEl.classList.add("current-sentence");
        fraseDestacada = fraseEl;
        if (seguirLeituraAutomaticamente) {
            // Desloca apenas o painel de leitura, nunca a página inteira.
            const area = painelLeitura.getBoundingClientRect();
            const caixa = fraseEl.getBoundingClientRect();
            if (caixa.bottom > area.bottom - 8)
                painelLeitura.scrollTop += caixa.bottom - area.bottom + 12;
            else if (caixa.top < area.top + 8)
                painelLeitura.scrollTop += caixa.top - area.top - 12;
        }
    } else fraseDestacada = null;
}

function renderizarLeitura() {
    if (versaoRenderizada === versaoTexto) {aplicarDestaque(); atualizarInterfaceTempo(); return;}
    palavraDestacada = null;
    fraseDestacada = null;
    trechoDestacado = null;
    painelLeitura.replaceChildren();
    if (!frases.length) {
        painelLeitura.textContent = "Aguardando texto...";
        versaoRenderizada = versaoTexto;
        atualizarInterfaceTempo();
        return;
    }
    const fragmento = document.createDocumentFragment();
    frases.forEach((frase, index) => {
        const spanFrase = document.createElement("span");
        spanFrase.id = "frase-" + index;
        spanFrase.className = "sentence";
        spanFrase.dataset.index = String(index);
        const palavras = palavrasPorFrase[index] || [];
        const grupos = construirSegmentosPiper(frase, palavras);
        let cursor = 0;
        grupos.forEach((grupo, indiceGrupo) => {
            if (grupo.inicio > cursor) spanFrase.appendChild(document.createTextNode(frase.slice(cursor, grupo.inicio)));
            const trecho = document.createElement("span");
            trecho.className = "reading-chunk";
            trecho.dataset.grupo = String(indiceGrupo);
            trecho.dataset.inicio = String(grupo.inicio);
            trecho.dataset.fim = String(grupo.fim);
            let dentro = grupo.inicio;
            grupo.tokens.forEach(palavra => {
                if (palavra.inicio > dentro) trecho.appendChild(document.createTextNode(frase.slice(dentro, palavra.inicio)));
                const spanPalavra = document.createElement("span");
                spanPalavra.className = "word";
                spanPalavra.dataset.inicio = String(palavra.inicio);
                spanPalavra.dataset.fim = String(palavra.fim);
                spanPalavra.textContent = palavra.texto;
                trecho.appendChild(spanPalavra);
                dentro = palavra.fim;
            });
            if (dentro < grupo.fim) trecho.appendChild(document.createTextNode(frase.slice(dentro, grupo.fim)));
            spanFrase.appendChild(trecho);
            cursor = grupo.fim;
        });
        if (cursor < frase.length) spanFrase.appendChild(document.createTextNode(frase.slice(cursor)));
        fragmento.appendChild(spanFrase);
        fragmento.appendChild(document.createTextNode(" "));
    });
    painelLeitura.appendChild(fragmento);
    versaoRenderizada = versaoTexto;
    aplicarDestaque();
    atualizarInterfaceTempo();
}
function prepararTexto() {
    const texto = campoTexto.value.trim();
    textoPreparado = texto;
    frases = [];
    palavrasPorFrase = [];
    indiceAtual = 0;
    posicaoNoBloco = 0;
    inicioPalavraAtual = -1;
    fimPalavraAtual = -1;
    leituraConcluida = false;
    versaoTexto++;
    if (!texto) { renderizarLeitura(); return; }
    // Cada frase é uma unidade clicável e uma geração Piper independente.
    // O primeiro áudio é pequeno, para começar rapidamente, e o clique nunca
    // recua para um bloco longo que contém várias frases.
    // Os pontos de abreviações não devem ser confundidos com finais de frase.
    // Substituição com o mesmo comprimento, restaurada antes da reprodução.
    const marcado=texto.replace(/\b(?:Sras|Srs|Sra|Sr|Dra|Dr|Enga|Eng|Exma|Exmo|Av|Prof)\./gi,
        valor=>valor.slice(0,-1)+"\uE000");
    const partes = marcado.match(/[^.!?…]+(?:[.!?…]+["'”’)]*|$)/g) || [marcado];
    for (const parteOriginal of partes) {
        let parte = parteOriginal.replace(/\uE000/g,".").trim();
        while (parte.length) {
            if (parte.length <= 440) { frases.push(parte); break; }
            let corte = -1;
            const janela = parte.slice(0, 440);
            for (const match of janela.matchAll(/[,;:]\s+/g)) {
                if (match.index > 155) corte = match.index + match[0].length;
            }
            if (corte < 0) corte = parte.lastIndexOf(" ", 440);
            if (corte < 100) corte = 440;
            frases.push(parte.slice(0, corte).trim());
            parte = parte.slice(corte).trim();
        }
    }
    palavrasPorFrase = frases.map(tokenizarPalavras);
    renderizarLeitura();
}

function garantirTextoPreparado() {
    const textoAtual = campoTexto.value.trim();
    if (!textoAtual) return false;
    if (textoAtual !== textoPreparado || !frases.length) prepararTexto();
    return frases.length > 0;
}
function definirCursor(indice, inicio, fim) {
    indiceAtual = indice;
    const token = palavraEm(indice, inicio);
    if (token) {
        posicaoNoBloco = token.inicio;
        inicioPalavraAtual = token.inicio;
        fimPalavraAtual = token.fim;
    } else {
        posicaoNoBloco = inicio;
        inicioPalavraAtual = inicio;
        fimPalavraAtual = typeof fim === "number" ? fim : inicio;
    }
    leituraConcluida = false;
}
function palavraGlobalPorIndice(indicePalavra) {
    let acumulado = 0;
    for (let i = 0; i < palavrasPorFrase.length; i++) {
        const lista = palavrasPorFrase[i];
        if (indicePalavra < acumulado + lista.length) {
            return { indiceFrase: i, palavra: lista[indicePalavra - acumulado] };
        }
        acumulado += lista.length;
    }
    const ultimaFrase = palavrasPorFrase.length - 1;
    const lista = palavrasPorFrase[ultimaFrase] || [];
    return lista.length ? { indiceFrase: ultimaFrase, palavra: lista[lista.length - 1] } : null;
}
function saltarPara(indice, inicio, opcoes = {}) {
    if (!garantirTextoPreparado()) return;
    const estavaTocando = reproduzindo;
    pararMotor();
    indiceTrechoAtual = -1;
    definirCursor(indice, 0);
    definirModoLeitura(true);
    renderizarLeitura();
    if (estavaTocando || opcoes.reproduzir) playAudio();
}

function totalPalavras() {
    return palavrasPorFrase.reduce((soma, lista) => soma + lista.length, 0);
}
function saltarPorFracao(fracao) {
    if (!garantirTextoPreparado()) return;
    const total = totalPalavras();
    if (!total) return;
    const indicePalavra = Math.max(0, Math.min(total - 1, Math.floor(fracao * total)));
    const alvo = palavraGlobalPorIndice(indicePalavra);
    if (!alvo) return;
    saltarPara(alvo.indiceFrase, alvo.palavra.inicio);
}


function playAudio() {
    if (!garantirTextoPreparado()) {stopAudio(); return;}
    if (leituraConcluida || (indiceAtual >= frases.length - 1 && posicaoNoBloco >= (frases[indiceAtual] || "").length)) {
        indiceAtual = 0;
        posicaoNoBloco = 0;
        inicioPalavraAtual = -1;
        fimPalavraAtual = -1;
        leituraConcluida = false;
        renderizarLeitura();
    }
    definirModoLeitura(true);
    if (reproduzindo) return;
    if (!ehVozPiper(vozAtual())) {
        definirStatus("A carregar vozes Piper… Confirma que o servidor local está ativo.");
        return;
    }
    iniciarPiper();
}
function pauseAudio() {
    if (!reproduzindo) return;
    if (audioPiper) {
        audioPiper.pause();
        reproduzindo = false;
        pausarRelogio();
        definirStatus("Pausado · Piper");
    } else {
        cancelarPreparacaoPiper();
        limparAudioPiper();
        reproduzindo = false;
        idReproducao++;
        pausarRelogio();
        definirStatus("Pausado · a geração foi cancelada");
    }
}
function stopAudio() {
    pararMotor();
    indiceAtual = 0;
    posicaoNoBloco = 0;
    inicioPalavraAtual = -1;
    fimPalavraAtual = -1;
    leituraConcluida = false;
    reiniciarRelogio(false);
    definirModoLeitura(false);
    renderizarLeitura();
    campoTexto.focus();
}
function atualizarConfiguracoesVoz() {
    atualizarVisibilidadeSincronia();
    atualizarInterfaceTempo();
    const voz = vozAtual();
    const mudouVoz = voz !== vozAnterior;
    vozAnterior = voz;
    if (audioPiper && !mudouVoz) {
        audioPiper.playbackRate = velocidadeAtual();
        return;
    }
    if (!reproduzindo) {
        if (mudouVoz) {cancelarPreparacaoPiper(); limparAudioPiper();}
        return;
    }
    if (mudouVoz) {pararMotor(); playAudio();}
}
function proximaFrase() {
    if (!garantirTextoPreparado()) return;
    if (indiceAtual < frases.length - 1) {
        const estavaTocando = reproduzindo;
        pararMotor({ manterRelogio: estavaTocando });
        indiceAtual++;
        posicaoNoBloco = 0;
        inicioPalavraAtual = -1;
        fimPalavraAtual = -1;
        leituraConcluida = false;
        const primeira = (palavrasPorFrase[indiceAtual] || [])[0];
        if (primeira) definirCursor(indiceAtual, primeira.inicio, primeira.fim);
        definirModoLeitura(true);
        renderizarLeitura();
        if (estavaTocando) playAudio();
    }
}
function fraseAnterior() {
    if (!garantirTextoPreparado()) return;
    if (indiceAtual > 0) {
        const estavaTocando = reproduzindo;
        pararMotor({ manterRelogio: estavaTocando });
        indiceAtual--;
        posicaoNoBloco = 0;
        inicioPalavraAtual = -1;
        fimPalavraAtual = -1;
        leituraConcluida = false;
        const primeira = (palavrasPorFrase[indiceAtual] || [])[0];
        if (primeira) definirCursor(indiceAtual, primeira.inicio, primeira.fim);
        definirModoLeitura(true);
        renderizarLeitura();
        if (estavaTocando) playAudio();
    }
}

function atualizarListaVozes() {
    const select = document.getElementById("voz");
    const anterior = select.value || vozAnterior;
    select.replaceChildren();
    vozesPiper.forEach(v => {
        const opt = document.createElement("option");
        opt.value = PREFIXO_VOZ_PIPER + v.id;
        opt.textContent = "🔊 Piper offline — " + v.name;
        select.appendChild(opt);
    });
    if (!vozesPiper.length) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "Sem vozes Piper disponíveis — verifica o servidor local";
        select.appendChild(opt);
        definirStatus("Sem vozes Piper disponíveis");
    }
    const disponiveis = Array.from(select.options);
    select.value = disponiveis.some(o => o.value === anterior) ? anterior : (disponiveis[0] ? disponiveis[0].value : "");
    vozAnterior = select.value;
    atualizarVisibilidadeSincronia();
    if (vozesPiper.length && estadoLeitura.textContent.includes("Sem vozes Piper")) definirStatus("");
}
async function carregarVozesPiper() {
    try {
        const resposta = await fetch("/api/voices", {cache: "no-store"});
        if (!resposta.ok) throw new Error("Servidor indisponível");
        const dados = await resposta.json();
        vozesPiper = Array.isArray(dados.voices) ? dados.voices : [];
        atualizarListaVozes();
    } catch (erro) {
        vozesPiper = [];
        atualizarListaVozes();
        console.warn("Vozes Piper indisponíveis:", erro);
    }
}
carregarVozesPiper();
atualizarVisibilidadeSincronia();

painelLeitura.addEventListener("click", evento => {
    const selecionado = window.getSelection();
    // Preserve text selection/copy without accidentally restarting playback.
    if (selecionado && !selecionado.isCollapsed) return;
    const elemento = evento.target instanceof Element ? evento.target : evento.target.parentElement;
    const fraseEl = elemento && elemento.closest(".sentence");
    if (!fraseEl) return;
    saltarPara(Number(fraseEl.dataset.index), 0, {reproduzir: true});
});

faixaProgresso.addEventListener("click", evento => {
    const caixa = faixaProgresso.getBoundingClientRect();
    if (!caixa.width) return;
    saltarPorFracao(Math.max(0, Math.min(1, (evento.clientX - caixa.left) / caixa.width)));
});
faixaProgresso.addEventListener("keydown", evento => {
    if (evento.key !== "ArrowLeft" && evento.key !== "ArrowRight") return;
    evento.preventDefault();
    const delta = evento.key === "ArrowRight" ? 0.05 : -0.05;
    saltarPorFracao(Math.max(0, Math.min(1, calcularFracaoLeitura() + delta)));
});
function substituirTranscricao(texto) {
    seguirLeituraAutomaticamente = true;
    atualizarBotaoSeguimento();
    pararMotor();
    definirModoLeitura(false);
    const protegido=protegerTranscricao(texto);
    campoTexto.value = protegido.texto;
    textoPreparado = "";
    prepararTexto();
    campoTexto.focus();
    campoTexto.select();
    const aviso=document.getElementById("privacyResult");
    if(aviso) aviso.textContent=texto
        ? ("Substituições: "+protegido.substituicoes+". Todos os algarismos detetados são ocultados; nomes permanecem visíveis. Revê moradas e identificadores.")
        : "Transcrição limpa.";
    definirStatus(texto ? "Proteção aplicada — revê os dados antes de ler." : "Transcrição limpa");
}
function limparTranscricao() { substituirTranscricao(""); }
// O texto é de consulta: aceita apenas colar nova transcrição e limpar tudo.
// Não permite editar letras, apagar frases isoladas ou alterar o texto lido.
campoTexto.addEventListener("paste", evento => {
    evento.preventDefault();
    const texto = evento.clipboardData && evento.clipboardData.getData("text/plain");
    if (typeof texto === "string" && texto.length) substituirTranscricao(texto);
});
painelLeitura.addEventListener("paste", evento => {
    evento.preventDefault();
    const texto = evento.clipboardData && evento.clipboardData.getData("text/plain");
    if (typeof texto === "string" && texto.length) substituirTranscricao(texto);
});
// Em modo leitura Ctrl+A permite selecionar a transcrição para copiar.
// Um segundo Ctrl+A não altera nem desbloqueia o texto.
document.addEventListener("keydown", evento => {
    const alvo = evento.target;
    const inputAtivo = alvo === campoTexto;
    const emLeitura = document.querySelector(".container").classList.contains("reading-mode");
    const leitorAtivo = emLeitura && alvo !== campoTexto &&
        !(alvo && (alvo.tagName === "INPUT" || alvo.tagName === "SELECT"));
    if ((evento.ctrlKey || evento.metaKey) && evento.key.toLowerCase() === "a" && leitorAtivo) {
        evento.preventDefault();
        const selecao = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(painelLeitura);
        selecao.removeAllRanges();
        selecao.addRange(range);
        painelLeitura.focus({preventScroll:true});
        return;
    }
    if (evento.key === "Backspace" || evento.key === "Delete") {
        if (inputAtivo && campoTexto.selectionStart === 0 && campoTexto.selectionEnd === campoTexto.value.length) {
            evento.preventDefault(); limparTranscricao(); return;
        }
        if (leitorAtivo) {
            const selecao = window.getSelection();
            if (selecao && !selecao.isCollapsed && selecao.toString().trim() === painelLeitura.textContent.trim()) {
                evento.preventDefault(); limparTranscricao(); return;
            }
        }
    }
    if (inputAtivo || (alvo && (alvo.tagName === "INPUT" || alvo.tagName === "SELECT" || alvo.isContentEditable))) return;
    if (evento.code === "Space" || evento.key === "k") {
        evento.preventDefault();
        if (reproduzindo) pauseAudio(); else playAudio();
    } else if (evento.key === "ArrowLeft") {
        evento.preventDefault(); fraseAnterior();
    } else if (evento.key === "ArrowRight") {
        evento.preventDefault(); proximaFrase();
    }
});

vozAnterior = vozAtual();
atualizarBotaoSeguimento();
atualizarInterfaceTempo();
</script>
