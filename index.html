<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Watson Reader Pro</title>

<style>

html{
    min-height:100%;
    background:#080d18;
    overscroll-behavior-y:none;
}

body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    box-sizing:border-box;
    overscroll-behavior-y:none;
    padding:28px 18px;
    background:
        radial-gradient(ellipse at 50% -12%, rgba(255,0,18,.68), transparent 48%),
        radial-gradient(ellipse at 4% 48%, rgba(230,0,0,.48), transparent 34%),
        radial-gradient(ellipse at 98% 52%, rgba(230,0,0,.44), transparent 36%),
        radial-gradient(ellipse at 50% 115%, rgba(230,0,0,.38), transparent 46%),
        repeating-radial-gradient(ellipse at 50% 8%, transparent 0 185px, rgba(255,20,35,.32) 188px 194px, transparent 199px 320px),
        linear-gradient(135deg, #080d18 0%, #111827 55%, #100b12 100%);
    background-attachment:fixed;
    color:white;
    font-family:Segoe UI, system-ui, sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.container > *{ position:relative; z-index:1; }

/* O logótipo grande fica fora do painel; não interfere com os controlos. */
.container::before,
.container::after{
    content:none !important;
}

.app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding-bottom:16px;
    margin-bottom:20px;
    border-bottom:1px solid rgba(255,255,255,.09);
}

h1{
    margin:0;
    font-size:clamp(24px, 3vw, 34px);
    letter-spacing:-.6px;
    text-shadow:0 2px 18px rgba(0,0,0,.25);
}

.headphones{ margin-right:7px; }
.pro{ color:#ff3038; }

.brand{
    display:flex;
    align-items:center;
    gap:9px;
    flex-shrink:0;
    color:#ff3038;
    font-size:clamp(20px, 2.5vw, 30px);
    font-weight:750;
    letter-spacing:-.8px;
    text-shadow:0 0 18px rgba(230,0,0,.18);
}

.vodafone-mark{
    display:inline-block;
    width:34px;
    height:34px;
    border-radius:50%;
    background:#e60000;
    position:relative;
    box-shadow:0 0 16px rgba(230,0,0,.2);
}

.vodafone-mark::after{
    content:"";
    position:absolute;
    width:17px;
    height:19px;
    left:10px;
    top:4px;
    border-radius:55% 45% 55% 45%;
    background:#111827;
    transform:rotate(28deg);
}

.container{
    box-sizing:border-box;
    width:min(1320px, 100%);
    margin: auto 0;
    background:linear-gradient(145deg, rgba(31,41,55,.97), rgba(17,24,39,.98));
    border:1px solid rgba(255,255,255,.07);
    border-top:3px solid #E60000;
    border-radius:18px;
    box-shadow:0 24px 70px rgba(0,0,0,.42), 0 0 44px rgba(230,0,0,.16);
    padding:26px;
    position:relative;
    overflow:hidden;
}

h1{
    margin-top:0;
    padding-bottom:14px;
    border-bottom:1px solid rgba(255,255,255,.09);
    letter-spacing:-.4px;
    text-shadow:0 2px 18px rgba(0,0,0,.25);
}

h1::first-letter{
    color:#ff3333;
}

.reader{
    height:300px;
    margin-top:14px;
    overflow:auto;
    background:rgba(8,18,37,.82);
    border:1px solid rgba(96,165,250,.16);
    border-radius:12px;
    padding:20px;
    line-height:1.8;
    font-size:16px;
}

.highlight{
    background:#facc15;
    color:black;
    border-radius:4px;
}

.toolbar{
    margin-top:0;
    display:flex;
    gap:7px;
    align-items:center;
    flex-wrap:nowrap;
    width:100%;
}

.voice-controls{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:nowrap;
    margin-left:auto;
    padding-left:0;
    border-left:0;
    flex:0 1 auto;
    min-width:0;
}

.voice-controls #voz{
    width:clamp(150px, 22vw, 270px);
    min-width:120px;
    max-width:270px;
}

.voice-controls #velocidade{
    flex:0 0 76px;
    min-width:76px;
}

/* Controlos futuristas: painel escuro, contornos subtis e brilho vermelho. */
.toolbar{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:nowrap;
    padding:9px;
    margin-top:14px;
    background:linear-gradient(135deg, rgba(8,15,29,.94), rgba(20,27,42,.88));
    border:1px solid rgba(148,163,184,.18);
    border-radius:16px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.035), 0 10px 30px rgba(0,0,0,.16);
}
button{
    min-height:36px;
    padding:8px 11px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:11px;
    cursor:pointer;
    font:600 13px/1.1 "Segoe UI",system-ui,sans-serif;
    letter-spacing:.2px;
    transition:transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease, filter .18s ease;
}
button:hover{ transform:translateY(-1px); filter:brightness(1.1); }
button:active{ transform:translateY(0) scale(.98); }
button:focus-visible{ outline:2px solid #ff4d4d; outline-offset:3px; }
.play{
    color:#fff;
    background:linear-gradient(135deg,#ff3038,#c90018);
    border-color:rgba(255,85,95,.65);
    box-shadow:0 0 18px rgba(230,0,0,.22), inset 0 1px 0 rgba(255,255,255,.18);
}
.pause,.stop,.nav{
    color:#e5edf8;
    background:linear-gradient(180deg,rgba(51,65,85,.72),rgba(30,41,59,.9));
    border-color:rgba(148,163,184,.2);
}
.pause:hover,.stop:hover,.nav:hover{
    background:linear-gradient(180deg,rgba(71,85,105,.86),rgba(39,52,73,.98));
    border-color:rgba(255,255,255,.22);
    box-shadow:0 0 14px rgba(148,163,184,.08);
}
.stop{ color:#ff9a9f; }
.nav{ min-width:36px; padding:8px 9px; font-size:14px; }
select{
    min-height:36px;
    padding:7px 28px 7px 10px;
    color:#e5edf8;
    background-color:#111c30;
    border:1px solid rgba(148,163,184,.24);
    border-radius:11px;
    outline:none;
}
select:focus-visible{
    border-color:#ff454d;
    box-shadow:0 0 0 3px rgba(230,0,0,.13);
}

textarea{
    display:block;
    box-sizing:border-box;
    width:100%;
    height:170px;
    border:1px solid #3b4a63;
    border-radius:14px;
    padding:18px 20px;
    margin-top:20px;
    margin-bottom:15px;
    resize:vertical;
    background:linear-gradient(145deg, #111c30, #0f172a);
    color:#e5edf8;
    font-family:Inter, "Segoe UI", system-ui, sans-serif;
    font-size:16px;
    line-height:1.7;
    letter-spacing:0.1px;
    outline:none;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.18), 0 4px 14px rgba(0,0,0,.10);
    transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
}

textarea::placeholder{
    color:#8291a9;
    opacity:1;
}

textarea:hover{
    border-color:#526783;
}

textarea:focus{
    border-color:#60a5fa;
    background:#101b2e;
    box-shadow:0 0 0 3px rgba(96,165,250,.16), inset 0 1px 3px rgba(0,0,0,.15);
}

textarea::selection{
    background:rgba(96,165,250,.4);
    color:#ffffff;
}

.time-progress{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-top:0;
    margin-bottom:8px;
    color:#cbd5e1;
    font-size:13px;
}

.time-progress strong{
    color:#ffffff;
    font-variant-numeric:tabular-nums;
    font-weight:700;
}

.progress{
    width:100%;
    height:7px;
    background:#374151;
    border-radius:999px;
    margin-top:0;
    margin-bottom:14px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#22c55e;
    transition:width .1s linear;
}


/* Uma única área de conteúdo: edição e leitura alternam no mesmo espaço. */
.text-stage{
    position:relative;
    margin-top:20px;
    border-radius:14px;
}
.text-stage textarea{
    margin-top:0;
    margin-bottom:0;
    height:300px;
}
.text-stage .reader{
    display:none;
    box-sizing:border-box;
    height:300px;
    margin:0;
    overflow:auto;
    background:rgba(8,18,37,.82);
    border:1px solid rgba(96,165,250,.16);
    border-radius:14px;
    padding:22px 24px;
    line-height:1.9;
    font-size:17px;
    color:#e5edf8;
}
.container.reading-mode .text-stage textarea{
    display:none;
}
.container.reading-mode .text-stage .reader{
    display:block;
}
.toolbar{
    margin-top:14px;
}
@media (max-width:650px){
    .toolbar{ padding:10px; gap:7px; }
    .voice-controls{
        width:100%;
        margin-left:0;
        padding-left:0;
        padding-top:9px;
        border-left:0;
        border-top:1px solid rgba(148,163,184,.16);
    }
    .voice-controls #voz{ flex:1 1 180px; max-width:100%; }
}
@media (max-width:650px){
    .text-stage textarea,
    .text-stage .reader{
        height:260px;
        padding:15px;
        font-size:15px;
    }
    .toolbar{
        gap:8px;
    }
    .toolbar button{
        padding:9px 12px;
    }
    .voice-controls{
        flex-wrap:wrap;
    }
    .voice-controls #voz{
        max-width:calc(100vw - 70px);
    }
}

@media (max-width:650px){
    body{padding:14px 10px; align-items:flex-start;}
    .container{padding:17px;}
    .app-header{align-items:flex-start; flex-direction:column; gap:12px;}
    .brand{font-size:22px;}
    .vodafone-mark{width:27px;height:27px;}
    .vodafone-mark::after{width:14px;height:15px;left:8px;top:4px;}
    .container::before{top:112px;font-size:clamp(38px, 9vw, 62px);letter-spacing:-2px;opacity:.18;}\n    .container::after{top:109px;left:calc(50% - 115px);width:34px;height:34px;border-width:9px;}
    .toolbar select#voz{max-width:100%;}
    .voice-controls{max-width:100%;}
    .voice-controls #voz{max-width:calc(100vw - 150px);}
}


/* Ajustes de alinhamento e compactação dos controlos */
@media (max-width: 900px) and (min-width: 651px){
    .toolbar{flex-wrap:wrap;}
    .voice-controls{margin-left:auto;}
    .voice-controls #voz{width:190px; min-width:130px;}
}
@media (max-width:650px){
    .toolbar{flex-wrap:wrap; gap:6px; padding:9px;}
    .toolbar button{min-height:34px; padding:7px 9px; font-size:12px;}
    .toolbar .nav{min-width:32px; padding:7px;}
    .voice-controls{width:100%; margin-left:0; padding-top:8px; border-top:1px solid rgba(148,163,184,.16); flex-wrap:nowrap;}
    .voice-controls #voz{flex:1 1 auto; width:auto; min-width:0; max-width:none;}
    .voice-controls #velocidade{flex:0 0 82px;}
    .time-progress{font-size:12px; gap:6px;}
}

</style>

<body>

<div class="container">

<header class="app-header">
  <h1><span class="headphones" aria-hidden="true">🎧</span> Watson Reader <span class="pro">Pro</span></h1>
  <div class="brand" aria-label="Vodafone"><span class="vodafone-mark" aria-hidden="true"></span><span>vodafone</span></div>
</header>

<div class="time-progress" aria-live="polite">
  <span>Tempo decorrido: <strong id="elapsedTime">00:00</strong></span>
  <span>Duração estimada: <strong id="totalTime">00:00</strong></span>
</div>

<div class="progress">
  <div id="progressBar" class="progress-bar"></div>
</div>

<div class="text-stage" id="textStage">
  <textarea
      id="inputText"
      placeholder="Cole aqui sua transcrição..."
      aria-label="Texto para narrar"
  ></textarea>

  <div id="reader" class="reader" aria-label="Texto em leitura" aria-live="off">
    Aguardando texto...
  </div>
</div>

<div class="toolbar">

<button
class="play"
onclick="playAudio()">
▶ Play
</button>

<button
class="pause"
onclick="pauseAudio()">
⏸ Pause
</button>

<button
class="stop"
onclick="stopAudio()">
⏹ Stop
</button>

<button
class="nav"
onclick="fraseAnterior()">
⏪
</button>

<button
class="nav"
onclick="proximaFrase()"
aria-label="Próxima frase">
⏩
</button>


<div class="voice-controls">
  <select id="voz" onchange="atualizarConfiguracoesVoz()" aria-label="Escolher voz em português">
      <option value="">A carregar vozes em português...</option>
  </select>

  <select id="velocidade" onchange="atualizarConfiguracoesVoz()" aria-label="Velocidade da leitura">
      <option value="1" selected>1x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
      <option value="2.5">2.5x</option>
      <option value="3">3x</option>
  </select>
</div>

</div>



</div>




<script>
let frases = [];
let indiceAtual = 0;
let utterance = null;
let reproduzindo = false;
let idReproducao = 0;
let posicaoNoBloco = 0;
let textoPreparado = "";
let destacarPalavra = false;
let inicioPalavraAtual = -1;
let fimPalavraAtual = -1;
let versaoTexto = 0;
let versaoRenderizada = -1;
let tempoDecorridoMs = 0;
let instanteInicioRelogio = null;
let intervaloRelogio = null;
let leituraConcluida = false;

function formatarTempo(segundos) {
    const total = Math.max(0, Math.floor(segundos || 0));
    const horas = Math.floor(total / 3600);
    const minutos = Math.floor((total % 3600) / 60);
    const segundosRestantes = total % 60;
    if (horas > 0) {
        return `${String(horas).padStart(2, "0")}:${String(minutos).padStart(2, "0")}:${String(segundosRestantes).padStart(2, "0")}`;
    }
    return `${String(minutos).padStart(2, "0")}:${String(segundosRestantes).padStart(2, "0")}`;
}

function calcularDuracaoEstimada() {
    const texto = document.getElementById("inputText").value.trim();
    const palavras = texto ? (texto.match(/\S+/g) || []).length : 0;
    const velocidade = Math.max(0.1, parseFloat(document.getElementById("velocidade").value) || 1);
    // Referência aproximada: 150 palavras/minuto a 1x; a duração real varia conforme a voz.
    const segundos = palavras ? (palavras / (150 * velocidade)) * 60 : 0;
    document.getElementById("totalTime").textContent = formatarTempo(segundos);
    atualizarBarra();
    return segundos;
}

function obterTempoDecorridoMs() {
    return tempoDecorridoMs + (instanteInicioRelogio !== null ? Date.now() - instanteInicioRelogio : 0);
}


function calcularFracaoLeitura() {
    const texto = document.getElementById("inputText").value.trim();
    const totalPalavras = (texto.match(/\S+/g) || []).length;

    if (totalPalavras === 0) return 0;
    if (leituraConcluida) return 1;

    let textoPercorrido = "";

    for (let i = 0; i < indiceAtual; i++) {
        textoPercorrido += (frases[i] || "") + " ";
    }

    if (frases[indiceAtual]) {
        const posicao = Math.max(
            0,
            Math.min(
                posicaoNoBloco,
                frases[indiceAtual].length
            )
        );

        textoPercorrido += frases[indiceAtual].slice(0, posicao);
    }

    const palavrasPercorridas =
        (textoPercorrido.match(/\S+/g) || []).length;

    return Math.max(
        0,
        Math.min(1, palavrasPercorridas / totalPalavras)
    );
}

function atualizarInterfaceTempo() {
    const estimado = calcularDuracaoEstimadaSilenciosa();
    const fracao = calcularFracaoLeitura();

    // O tempo acompanha a posição real da leitura no texto.
    const decorrido = estimado * fracao;

    document.getElementById("elapsedTime").textContent =
        formatarTempo(decorrido);

    document.getElementById("totalTime").textContent =
        formatarTempo(estimado);

    const barra = document.getElementById("progressBar");

    if (barra) {
        barra.style.width = (fracao * 100) + "%";
    }
}


function calcularDuracaoEstimadaSilenciosa() {
    const texto = document.getElementById("inputText").value.trim();
    const palavras = texto ? (texto.match(/\S+/g) || []).length : 0;
    const velocidade = Math.max(0.1, parseFloat(document.getElementById("velocidade").value) || 1);
    return palavras ? (palavras / (150 * velocidade)) * 60 : 0;
}

function iniciarRelogio() {
    if (instanteInicioRelogio !== null) return;
    leituraConcluida = false;
    instanteInicioRelogio = Date.now();
    if (intervaloRelogio !== null) clearInterval(intervaloRelogio);
    intervaloRelogio = setInterval(atualizarInterfaceTempo, 100);
    atualizarInterfaceTempo();
}

function pausarRelogio() {
    if (instanteInicioRelogio !== null) {
        tempoDecorridoMs += Date.now() - instanteInicioRelogio;
        instanteInicioRelogio = null;
    }
    if (intervaloRelogio !== null) {
        clearInterval(intervaloRelogio);
        intervaloRelogio = null;
    }
    atualizarInterfaceTempo();
}

function reiniciarRelogio(concluida = false) {
    tempoDecorridoMs = 0;
    instanteInicioRelogio = null;
    leituraConcluida = concluida;
    if (intervaloRelogio !== null) {
        clearInterval(intervaloRelogio);
        intervaloRelogio = null;
    }
    atualizarInterfaceTempo();
}

// Sincroniza o contador com a posição do texto ao saltar entre frases.

function sincronizarRelogioComTexto() {
    // O tempo e a barra são derivados da posição atual no texto.
    atualizarInterfaceTempo();
}

function prepararTexto() {
    const texto = document.getElementById("inputText").value.trim();

    textoPreparado = texto;
    reiniciarRelogio(false);
    versaoTexto++;
    frases = [];
    indiceAtual = 0;
    posicaoNoBloco = 0;

    if (!texto) {
        atualizarTexto();
        atualizarBarra();
        return;
    }

    const partes = texto.match(/[^.!?…]+(?:[.!?…]+["'”’)\]]*|$)/g) || [];
    const tamanhoMaximo = 500;
    let bloco = "";

    partes.forEach(parte => {
        parte = parte.trim();
        if (!parte) return;

        if (bloco && bloco.length + parte.length + 1 > tamanhoMaximo) {
            frases.push(bloco.trim());
            bloco = parte;
        } else {
            bloco += (bloco ? " " : "") + parte;
        }
    });

    if (bloco.trim()) {
        frases.push(bloco.trim());
    }

    atualizarTexto();
    atualizarBarra();
}





function atualizarTexto() {
    const reader = document.getElementById("reader");

    // Reconstrói o leitor apenas quando o texto muda.
    if (versaoRenderizada !== versaoTexto) {
        reader.innerHTML = "";

        frases.forEach((frase, index) => {
            const span = document.createElement("span");
            span.id = "frase-" + index;
            span.style.cursor = "text";
            span.title = "Clique numa palavra para começar a ler daqui";
            span.textContent = frase;

            span.addEventListener("click", (evento) => {
                let range = null;

                if (document.caretRangeFromPoint) {
                    range = document.caretRangeFromPoint(
                        evento.clientX,
                        evento.clientY
                    );
                } else if (document.caretPositionFromPoint) {
                    const ponto = document.caretPositionFromPoint(
                        evento.clientX,
                        evento.clientY
                    );

                    if (ponto) {
                        range = document.createRange();
                        range.setStart(ponto.offsetNode, ponto.offset);
                        range.collapse(true);
                    }
                }

                if (!range || !span.contains(range.startContainer)) return;

                const prefixo = document.createRange();
                prefixo.selectNodeContents(span);
                prefixo.setEnd(range.startContainer, range.startOffset);

                const posicao = Math.min(prefixo.toString().length, frase.length);
                let inicio = posicao;
                while (inicio > 0 && !/\s/.test(frase[inicio - 1])) inicio--;

                let fim = posicao;
                while (fim < frase.length && !/\s/.test(frase[fim])) fim++;

                reproduzindo = false;
                idReproducao++;
                speechSynthesis.cancel();
                indiceAtual = index;
                posicaoNoBloco = posicao;
                inicioPalavraAtual = inicio;
                fimPalavraAtual = fim;
                atualizarTexto();
                atualizarBarra();
            });

            reader.appendChild(span);
            reader.appendChild(document.createTextNode(" "));
        });

        versaoRenderizada = versaoTexto;
    }

    // Atualiza apenas as frases que precisam de mudar o destaque.
    frases.forEach((frase, index) => {
        const span = document.getElementById("frase-" + index);
        if (!span) return;

        const temDestaque = span.classList.contains("highlight") ||
            !!span.querySelector(".highlight");
        const eAtual = index === indiceAtual;

        if (eAtual || temDestaque) {
            span.innerHTML = "";
            span.classList.remove("highlight");

            const inicio = inicioPalavraAtual;
            const fim = fimPalavraAtual;

            if (eAtual && inicio >= 0 && fim > inicio) {
                span.appendChild(document.createTextNode(frase.slice(0, inicio)));
                const palavra = document.createElement("span");
                palavra.className = "highlight";
                palavra.textContent = frase.slice(inicio, fim);
                span.appendChild(palavra);
                span.appendChild(document.createTextNode(frase.slice(fim)));
            } else {
                span.textContent = frase;
                if (eAtual && !reproduzindo) span.classList.add("highlight");
            }
        }
    });

    // Só desloca o leitor se a palavra destacada sair da área visível.
    const palavraAtual = document.querySelector("#frase-" + indiceAtual + " .highlight");
    if (reproduzindo && palavraAtual) {
        const area = reader.getBoundingClientRect();
        const palavra = palavraAtual.getBoundingClientRect();
        if (palavra.bottom > area.bottom || palavra.top < area.top) {
            palavraAtual.scrollIntoView({ behavior: "auto", block: "nearest" });
        }
    }
}




function definirModoLeitura(ativar) {
    const container = document.querySelector(".container");
    if (container) container.classList.toggle("reading-mode", ativar);
}

function playAudio() {
    const textoAtual = document
        .getElementById("inputText")
        .value.trim();

    if (!textoAtual) {
        stopAudio();
        frases = [];
        textoPreparado = "";
        indiceAtual = 0;
        posicaoNoBloco = 0;
        atualizarTexto();
        atualizarBarra();
        return;
    }

    if (textoAtual !== textoPreparado) {
        stopAudio();
        prepararTexto();
    }

    if (frases.length === 0) return;

    // A leitura passa a ocupar a área principal quando o utilizador carrega em Play.
    atualizarTexto();
    definirModoLeitura(true);

    const minhaReproducao = ++idReproducao;

    speechSynthesis.cancel();
    reproduzindo = true;
    iniciarRelogio();

    lerBloco(minhaReproducao);
}



function lerBloco(minhaReproducao) {
    if (
        minhaReproducao !== idReproducao ||
        !reproduzindo ||
        indiceAtual >= frases.length
    ) {
        return;
    }

    const textoCompleto = frases[indiceAtual];

    // Guarda a posição inicial deste trecho de áudio.
    const inicioTrecho = posicaoNoBloco;

    // Lê somente o texto que ainda não foi pronunciado.
    const textoRestante = textoCompleto.slice(inicioTrecho);

    if (!textoRestante.trim()) {
        posicaoNoBloco = 0;

        if (indiceAtual < frases.length - 1) {
            indiceAtual++;
            atualizarTexto();
            atualizarBarra();
            lerBloco(minhaReproducao);
        } else {
            reproduzindo = false;
            pausarRelogio();
            leituraConcluida = true;
            atualizarInterfaceTempo();
            atualizarBarra();
        }

        return;
    }

    utterance = new SpeechSynthesisUtterance(textoRestante);

    const vozes = speechSynthesis.getVoices();
    const vozSelecionada = document.getElementById("voz").value;

    const voz = vozes.find(v => {
        const chave = `${v.name}|${v.lang}|${v.voiceURI}`;
        return chave === vozSelecionada;
    }) || vozes.find(v =>
        v.lang && v.lang.toLowerCase() === "pt-pt"
    ) || vozes.find(v =>
        v.lang && v.lang.toLowerCase() === "pt-br"
    ) || vozes.find(v =>
        v.lang && v.lang.toLowerCase().startsWith("pt")
    );

    if (voz) {
        utterance.voice = voz;
        utterance.lang = voz.lang;
    } else {
        // Mantém um idioma de recurso caso não exista voz portuguesa instalada.
        utterance.lang = "pt-BR";
    }

    utterance.rate = parseFloat(
        document.getElementById("velocidade").value
    );

    utterance.onstart = () => {
        if (minhaReproducao === idReproducao) {
            atualizarTexto();
            atualizarBarra();
        }
    };

    // Atualiza a posição conforme a voz avança pelas palavras.
   
utterance.onboundary = (evento) => {
    if (
        minhaReproducao !== idReproducao ||
        !reproduzindo
    ) {
        return;
    }

    if (evento.name === "word" || evento.charLength > 0) {
        const inicio = Math.max(
    inicioTrecho,
    Math.min(inicioTrecho + evento.charIndex, textoCompleto.length - 1)
);

        // Determina o tamanho da palavra pronunciada.
        const restante = textoCompleto.slice(inicio);
        const correspondencia = restante.match(/^\S+/);

        const tamanho = evento.charLength > 0
            ? evento.charLength
            : correspondencia
                ? correspondencia[0].length
                : 1;

        inicioPalavraAtual = inicio;
        fimPalavraAtual = Math.min(
            inicio + tamanho,
            textoCompleto.length
        );

        // Guarda a posição para permitir continuar a leitura.
        posicaoNoBloco = fimPalavraAtual;

        // Atualiza o destaque e acompanha o texto.
        atualizarTexto();
        atualizarBarra();
    }
};


    utterance.onend = () => {
        if (
            minhaReproducao !== idReproducao ||
            !reproduzindo
        ) {
            return;
        }

        // O bloco atual terminou.
        posicaoNoBloco = 0;

        if (indiceAtual < frases.length - 1) {
            indiceAtual++;
            atualizarTexto();
            atualizarBarra();
            lerBloco(minhaReproducao);
        } else {
            reproduzindo = false;
            pausarRelogio();
            leituraConcluida = true;
            atualizarInterfaceTempo();
            atualizarBarra();
        }
    };

    utterance.onerror = (evento) => {
        if (
            minhaReproducao === idReproducao &&
            evento.error !== "canceled" &&
            evento.error !== "interrupted"
        ) {
            reproduzindo = false;
            pausarRelogio();
            console.error("Erro na leitura:", evento.error);
        }
    };

    speechSynthesis.speak(utterance);
}
function pauseAudio() {
    if (speechSynthesis.speaking && !speechSynthesis.paused) {
        speechSynthesis.pause();
        pausarRelogio();
    }
}

function stopAudio() {
    reproduzindo = false;
    idReproducao++;
    speechSynthesis.cancel();
    reiniciarRelogio(false);

    // Mantém o bloco atual selecionado.
    atualizarTexto();
    atualizarBarra();
}



function atualizarConfiguracoesVoz() {
    calcularDuracaoEstimada();
    atualizarInterfaceTempo();
    if (!reproduzindo) return;

    // Invalida a reprodução anterior.
    idReproducao++;
    const minhaReproducao = idReproducao;

    // Interrompe o áudio atual.
    speechSynthesis.cancel();

    // Aguarda o cancelamento antes de iniciar a nova voz.
    setTimeout(() => {
        if (
            minhaReproducao !== idReproducao ||
            !reproduzindo
        ) {
            return;
        }

        lerBloco(minhaReproducao);
    }, 100);
}




function proximaFrase() {
    if (frases.length === 0) {
        prepararTexto();
    }

    if (indiceAtual < frases.length - 1) {
        indiceAtual++;
        reiniciarNoBlocoAtual();
    }
}

function fraseAnterior() {
    if (indiceAtual > 0) {
        indiceAtual--;
        reiniciarNoBlocoAtual();
    }
}

function reiniciarNoBlocoAtual() {
    const estavaTocando = reproduzindo;

    idReproducao++;
    speechSynthesis.cancel();
    posicaoNoBloco = 0;
    sincronizarRelogioComTexto();
    atualizarTexto();
    atualizarBarra();

    if (estavaTocando) {
        reproduzindo = true;
        const minhaReproducao = idReproducao;
        lerBloco(minhaReproducao);
    }
}


function atualizarBarra() {
    atualizarInterfaceTempo();
}


// Preenche o seletor com as vozes portuguesas disponíveis no navegador/sistema.
function atualizarListaVozes() {
    if (!("speechSynthesis" in window)) return;

    const seletor = document.getElementById("voz");
    const valorAnterior = seletor.value;
    const todasAsVozes = speechSynthesis.getVoices();

    const vozesPortuguesas = todasAsVozes
        .filter(v => v.lang && v.lang.toLowerCase().startsWith("pt"))
        .sort((a, b) => {
            // Mostra primeiro PT-PT e PT-BR, sem excluir outras variantes portuguesas.
            const prioridade = lang => {
                const codigo = (lang || "").toLowerCase();
                if (codigo === "pt-pt") return 0;
                if (codigo === "pt-br") return 1;
                return 2;
            };
            return prioridade(a.lang) - prioridade(b.lang)
                || a.name.localeCompare(b.name);
        });

    seletor.innerHTML = "";

    if (vozesPortuguesas.length === 0) {
        const opcao = document.createElement("option");
        opcao.value = "";
        opcao.textContent = "Nenhuma voz em português encontrada";
        seletor.appendChild(opcao);
        return;
    }

    vozesPortuguesas.forEach(voz => {
        const opcao = document.createElement("option");
        opcao.value = `${voz.name}|${voz.lang}|${voz.voiceURI}`;
        opcao.textContent = `${voz.name} (${voz.lang})`;
        seletor.appendChild(opcao);
    });

    if (vozesPortuguesas.some(v => `${v.name}|${v.lang}|${v.voiceURI}` === valorAnterior)) {
        seletor.value = valorAnterior;
    } else {
        // Escolhe PT-PT primeiro; se não existir, PT-BR; depois outra voz portuguesa.
        const preferida = vozesPortuguesas.find(v => v.lang.toLowerCase() === "pt-pt")
            || vozesPortuguesas.find(v => v.lang.toLowerCase() === "pt-br")
            || vozesPortuguesas[0];
        seletor.value = `${preferida.name}|${preferida.lang}|${preferida.voiceURI}`;
    }
}

// Algumas vozes só ficam disponíveis depois de o navegador as carregar.
if ("speechSynthesis" in window) {
    atualizarListaVozes();
    speechSynthesis.onvoiceschanged = atualizarListaVozes;
}

document.getElementById("inputText").addEventListener("input", () => {
    if (!reproduzindo) reiniciarRelogio(false);
    calcularDuracaoEstimada();
    atualizarInterfaceTempo();
});

calcularDuracaoEstimada();
actualizarInterfaceTempoInicial();

function actualizarInterfaceTempoInicial() {
    atualizarInterfaceTempo();
}
</script>
